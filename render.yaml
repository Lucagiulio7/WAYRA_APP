services:
  - type: web
    name: urveya-legal
    runtime: static
    rootDir: mobile
    buildCommand: echo "Urveya legal pages ready"
    staticPublishPath: public
    autoDeploy: true
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /delete-account
        destination: /delete-account.html
      - type: rewrite
        source: /support
        destination: /support.html
      - type: redirect
        source: /
        destination: /support

  - type: web
    name: wayra-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGINS
        value: "*"
